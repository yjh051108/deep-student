name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on windows-latest
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.2

      - name: Tidy modules
        run: go mod tidy

      - name: Run tests
        run: go test ./... -count=1

      - name: Build with Wails
        run: wails build -clean -o build/bin/deepstudent.exe

      - name: Install NSIS
        run: choco install nsis -y

      - name: Package installer
        shell: cmd
        run: |
          cd cmd\installer
          makensis /DAPP_VERSION=%GITHUB_REF_NAME:~1% installer.nsi
          if not exist "..\..\build\installer" mkdir "..\..\build\installer"
          move /Y "..\..\build\installer\DeepStudent-Setup-%GITHUB_REF_NAME:~1%.exe" "..\..\build\installer\" || dir /b "..\..\build\installer"

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp build/installer/DeepStudent-Setup-*.exe dist/
          cp build/bin/deepstudent.exe dist/ || true
          ls -la dist/

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          chmod +x scripts/release-shas.sh
          ./scripts/release-shas.sh dist/ SHA256SUMS.txt
          cp SHA256SUMS.txt dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepstudent-release-${{ github.ref_name }}
          path: |
            dist/DeepStudent-Setup-*.exe
            dist/SHA256SUMS.txt
            dist/deepstudent.exe

  upload:
    name: Upload to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: deepstudent-release-${{ github.ref_name }}
          path: dist

      - name: Show artifacts
        shell: bash
        run: |
          ls -la dist/
          cat dist/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: .github/RELEASE_TEMPLATE.md
          files: |
            dist/DeepStudent-Setup-${{ github.ref_name }}.exe
            dist/SHA256SUMS.txt
            dist/deepstudent.exe
