name: Codex Reference Build

on:
  workflow_dispatch:

concurrency:
  group: codex-reference-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: --bundles nsis
            artifact_glob: src-tauri/target/release/bundle/nsis/*
          - name: linux
            os: ubuntu-latest
            args: --bundles deb,appimage
            artifact_glob: |
              src-tauri/target/release/bundle/deb/*
              src-tauri/target/release/bundle/appimage/*
          - name: macos
            os: macos-latest
            args: --bundles app,dmg
            artifact_glob: |
              src-tauri/target/release/bundle/macos/*
              src-tauri/target/release/bundle/dmg/*

    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: codex-reference-${{ matrix.name }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf protobuf-compiler

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Disable updater signing artifacts for reference build
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.bundle = config.bundle || {};
          config.bundle.createUpdaterArtifacts = false;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Build Tauri bundle
        run: npx tauri build ${{ matrix.args }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codex-reference-${{ matrix.name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
